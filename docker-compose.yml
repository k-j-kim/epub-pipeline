services:
  # Torrent client — pulls Anna's Archive metadata dump + selected Korean EPUB torrents
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: kbfm-qbittorrent
    environment:
      - PUID=${PUID:-1026}
      - PGID=${PGID:-100}
      - TZ=${TZ:-Asia/Seoul}
      - WEBUI_PORT=8080
    volumes:
      - ${DATA_DIR}/qbittorrent/config:/config
      - ${DATA_DIR}/downloads:/downloads
      - ${DATA_DIR}/metadata:/metadata
    ports:
      - "${QB_PORT:-8080}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  # Calibre-web — library UI, dedupe, format conversion, send-to-Kindle
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: kbfm-calibre-web
    environment:
      - PUID=${PUID:-1026}
      - PGID=${PGID:-100}
      - TZ=${TZ:-Asia/Seoul}
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - ${DATA_DIR}/calibre/config:/config
      - ${DATA_DIR}/library:/books
    ports:
      - "${CW_PORT:-8083}:8083"
    restart: unless-stopped

  # Worker — runs cron jobs: metadata refresh, Korean EPUB selection, ingest, weekly Kindle push
  worker:
    build: ./worker
    container_name: kbfm-worker
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - KINDLE_EMAIL=${KINDLE_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - BOOKS_PER_WEEK=${BOOKS_PER_WEEK:-5}
      - QB_URL=http://qbittorrent:8080
      - QB_USER=${QB_USER:-admin}
      - QB_PASS=${QB_PASS:-adminadmin}
      - MIN_EPUB_KB=${MIN_EPUB_KB:-200}
      - MAX_EPUB_MB=${MAX_EPUB_MB:-50}
      - SOURCES=${SOURCES:-ia libgen zlib}
      - ZLIB_EMAIL=${ZLIB_EMAIL:-}
      - ZLIB_PASS=${ZLIB_PASS:-}
      - ZLIB_MAX_PER_RUN=${ZLIB_MAX_PER_RUN:-8}
      - ZLIB_HOSTS=${ZLIB_HOSTS:-z-library.gs 1lib.sk z-lib.fm z-lib.gd z-lib.sk zliba.ru}
      - IA_MAX_PER_RUN=${IA_MAX_PER_RUN:-40}
      - LIBGEN_MAX_PER_RUN=${LIBGEN_MAX_PER_RUN:-20}
      - LIBGEN_HOST=${LIBGEN_HOST:-libgen.li}
      - AA_MAX_PER_RUN=${AA_MAX_PER_RUN:-5}
      - AA_HOSTS=${AA_HOSTS:-annas-archive.pk annas-archive.li annas-archive.gs}
    volumes:
      - ${DATA_DIR}/metadata:/metadata
      - ${DATA_DIR}/downloads:/downloads
      - ${DATA_DIR}/library:/library
      - ${DATA_DIR}/worker/state:/state
      - ./scripts:/scripts:ro
    depends_on:
      - qbittorrent
      - calibre-web
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  # Management dashboard — status + manual triggers, on :${MGMT_PORT}
  mgmt:
    build: ./worker
    container_name: kbfm-mgmt
    command: ["python3", "/scripts/mgmt.py"]
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - KINDLE_EMAIL=${KINDLE_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - BOOKS_PER_WEEK=${BOOKS_PER_WEEK:-5}
      - QB_URL=http://qbittorrent:8080
      - QB_USER=${QB_USER:-admin}
      - QB_PASS=${QB_PASS:-adminadmin}
      - MIN_EPUB_KB=${MIN_EPUB_KB:-200}
      - MAX_EPUB_MB=${MAX_EPUB_MB:-50}
      - SOURCES=${SOURCES:-ia libgen zlib}
      - ZLIB_EMAIL=${ZLIB_EMAIL:-}
      - ZLIB_PASS=${ZLIB_PASS:-}
      - ZLIB_MAX_PER_RUN=${ZLIB_MAX_PER_RUN:-8}
      - ZLIB_HOSTS=${ZLIB_HOSTS:-z-library.gs 1lib.sk z-lib.fm z-lib.gd z-lib.sk zliba.ru}
      - IA_MAX_PER_RUN=${IA_MAX_PER_RUN:-40}
      - LIBGEN_MAX_PER_RUN=${LIBGEN_MAX_PER_RUN:-20}
      - LIBGEN_HOST=${LIBGEN_HOST:-libgen.li}
      - AA_MAX_PER_RUN=${AA_MAX_PER_RUN:-5}
      - AA_HOSTS=${AA_HOSTS:-annas-archive.pk annas-archive.li annas-archive.gs}
      - MGMT_PORT=8484
      - QB_PUBLIC_PORT=${QB_PORT:-8181}
      - CW_PUBLIC_PORT=${CW_PORT:-8283}
    volumes:
      - ${DATA_DIR}/metadata:/metadata
      - ${DATA_DIR}/downloads:/downloads
      - ${DATA_DIR}/library:/library
      - ${DATA_DIR}/worker/state:/state
      - ./scripts:/scripts:ro
    ports:
      - "${MGMT_PORT:-8484}:8484"
    depends_on:
      - worker
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
